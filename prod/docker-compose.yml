name: chat-prod

services:
  app:
    build:
      context: ../app
      dockerfile: ../prod/Dockerfile
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?defina no .env}
      INVITE_CODE: ${INVITE_CODE:?defina no .env}
    volumes:
      - chat_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    mem_limit: 512m
    networks: [internal]
    # sem "ports": só o Caddy é alcançável de fora
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    environment:
      HOST_IP: ${HOST_IP:?defina no .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

networks:
  internal:

volumes:
  chat_data:
  caddy_data:
  caddy_config:
