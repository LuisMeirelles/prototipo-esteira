name: chat-dev

services:
  app:
    build:
      context: ../app
      dockerfile: ../dev/Dockerfile
    environment:
      # porta própria para não colidir com a produção (80/443); o Origin exige a porta
      PUBLIC_ORIGIN: https://${HOST_IP:?defina no .env}:${DEV_HTTPS_PORT:-8443}
      INVITE_CODE: ${INVITE_CODE:?defina no .env}
      WEB_DIR: /app/web
    volumes:
      - ../app/server:/app/server:ro
      - ../app/web:/app/web:ro
      - chat_dev_data:/data
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    depends_on: [app]
    environment:
      HOST_IP: ${HOST_IP:?defina no .env}
      DEV_HTTPS_PORT: ${DEV_HTTPS_PORT:-8443}
    ports:
      - "${DEV_HTTP_PORT:-8080}:80"
      - "${DEV_HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

networks:
  internal:

volumes:
  chat_dev_data:
  caddy_data:
  caddy_config:
